[package]
name = "repurpose-server"
description = "The service skeleton: configuration, the health contract, wiring, and repurposectl."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "repurpose-server"
path = "src/main.rs"

[[bin]]
name = "repurposectl"
path = "src/bin/repurposectl.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
serde_json.workspace = true
sqlx.workspace = true
repurpose-accounts.workspace = true
repurpose-db.workspace = true
repurpose-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
repurpose-db = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["process"] }
tower.workspace = true

[lints]
workspace = true
